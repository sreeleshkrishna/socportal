server_tokens off;
limit_req_zone $binary_remote_addr zone=portal:10m rate=50r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

# plain HTTP only redirects
server {
    listen 80 default_server;
    server_name _;
    return 301 https://localhost$request_uri;
}

# the portal: static UI + API + SIEM webhook
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 30m;   # 25 MB evidence limit plus multipart overhead

    # short in the lab so browsers do not force https on other localhost tools; use 31536000 in production
    add_header Strict-Transport-Security "max-age=300" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=portal burst=100 nodelay;
        set $api http://api:4000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /webhooks/ {
        limit_req zone=portal burst=100 nodelay;
        set $api http://api:4000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://localhost:8443; object-src 'none'; base-uri 'self'; form-action 'self' https://localhost:8443; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}

# Keycloak behind the same TLS gateway
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        limit_req zone=portal burst=100 nodelay;
        set $kc http://keycloak:8080;
        proxy_pass $kc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}